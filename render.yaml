services:
  - type: web
    name: patchproof-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: OPENAI_API_KEY
        sync: false
  - type: web
    name: patchproof-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx next start --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NEXT_PUBLIC_API_BASE
        fromService:
          type: web
          name: patchproof-api
          envVarKey: RENDER_EXTERNAL_URL
